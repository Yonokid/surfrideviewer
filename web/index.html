<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SRD Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <h3>Files</h3>
  <input id="filter" placeholder="Filter…">
  <div id="files"></div>
  <h3>Patch</h3>
  <div style="display:flex; gap:6px; align-items:center">
    <button id="importPatch" disabled>Import…</button>
    <button id="exportPatch" disabled>Export</button>
    <button id="clearPatch" disabled>Remove</button>
    <input type="file" id="patchFile" accept=".json,application/json" hidden>
  </div>
  <label title="Applied in memory; .srd files are never modified"><input type="checkbox" id="patch" checked disabled> Apply <span class="tag" id="patchinfo"></span></label>
  <label id="tltexRow" hidden title="Use the translation's src/texture/*.dds instead of the game's"><input type="checkbox" id="tltex" checked> Translated textures</label>
  <h3>Scene</h3>
  <select id="scene"></select>
  <h3>Layers</h3>
  <div id="layers"></div>
  <h3>Animation</h3>
  <select id="anim"></select>
  <label title="Applied at its last frame underneath the playing animation. The game keeps whatever earlier animations set, so e.g. a gauge animation normally runs after A_in has faded the layer in.">Base pose
    <select id="baseAnim"></select></label>
  <label><input type="checkbox" id="showbg"> Scene background colour</label>
  <label><input type="checkbox" id="showbox"> Show bounding boxes</label>
</aside>
<main>
  <div id="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play">⏸</button>
    <input type="range" id="frame" min="0" max="0" value="0">
    <span id="flabel">0 / 0</span>
  </div>
  <div id="status"></div>
</main>
<aside>
  <h3>Nodes</h3>
  <div id="tree"></div>
  <h3>Selected</h3>
  <div id="editor"></div>
  <div id="info"></div>
</aside>
<script type="module" src="main.js"></script>
</body>
</html>
